<h2 class="title">Sucursales</h2>

<!-- Cargando -->
<section *ngIf="cargando" class="state">Cargando sucursales…</section>

<!-- Error -->
<section *ngIf="!cargando && error" class="state error">
  {{ error }}
</section>

<!-- Lista vacía -->
<section *ngIf="!cargando && !error && sucursales.length === 0" class="state">
  No hay sucursales para mostrar.
</section>

<!-- Tabla -->
<section *ngIf="!cargando && !error && sucursales.length > 0">
  <div class="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Ciudad</th><th>Dirección</th><th>Teléfono</th><th>Activa</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of sucursales; trackBy: trackId">
          <td>{{ s.id }}</td>
          <td>{{ s.nombre }}</td>
          <td>{{ s.ciudad }}</td>
          <td>{{ s.direccion }}</td>
          <td>{{ s.telefono }}</td>
          <td>{{ s.activo ? 'Sí' : 'No' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
